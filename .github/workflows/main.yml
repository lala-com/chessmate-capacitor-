name: Build CHESSMATE Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug and Release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Sign Release APK with Original Keystore
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/chessmate-signing.keystore"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="app/build/outputs/apk/release/CHESSMATE-release.apk"

          test -f "$APK_UNSIGNED"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$APKSIGNER" verify "$APK_SIGNED"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CHESSMATE-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CHESSMATE-release-APK
          path: android/app/build/outputs/apk/release/CHESSMATE-release.apk
          
